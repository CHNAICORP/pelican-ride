<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg',TAU=Math.PI*2;
for(const [id,cx] of [['rearSpokes',300],['frontSpokes',668]]){for(let i=0;i<14;i++){const a=i*TAU/14,l=document.createElementNS(NS,'line');Object.entries({x1:cx,y1:492,x2:cx+89*Math.cos(a),y2:492+89*Math.sin(a)}).forEach(([k,v])=>l.setAttribute(k,v));$(id).append(l)}const valve=document.createElementNS(NS,'path');valve.setAttribute('d',`M${cx} 401v9`);valve.setAttribute('stroke','#304642');valve.setAttribute('stroke-width','3');$(id).append(valve)}
let t=0,last=null,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,speed=1;
const set=(id,k,v)=>$(id).setAttribute(k,v),tr=(id,v)=>set(id,'transform',v);
function leg(a,near,bob){const x=439+35*Math.cos(a),y=487+35*Math.sin(a),hx=near?411:399,hy=343+bob;const dx=x-hx,dy=y-hy,d=Math.hypot(dx,dy),upper=96,lower=94,q=Math.min(d,upper+lower-.01),along=(upper*upper-lower*lower+q*q)/(2*q),height=Math.sqrt(Math.max(0,upper*upper-along*along));const kx=hx+along*dx/d+height*dy/d,ky=hy+along*dy/d-height*dx/d;set(near?'nearLegPath':'farLegPath','d',`M${hx} ${hy}Q${hx-5} ${hy+16} ${kx} ${ky}L${x} ${y-5}`);set(near?'nearFoot':'farFoot','d',`M${x-7} ${y-4}Q${x+9} ${y-2} ${x+19} ${y-1}`);return {x,y}}
function render(time){const a=time*TAU*.65,bob=2.6*Math.sin(a*2),wheel=time*TAU*.65*1.75*180/Math.PI;tr('rearSpokes',`rotate(${wheel} 300 492)`);tr('frontSpokes',`rotate(${wheel} 668 492)`);tr('bird',`translate(0 ${bob})`);tr('head',`rotate(${Math.sin(a)*1.2} 490 186)`);const f=leg(a+Math.PI,false,bob),n=leg(a,true,bob);set('crank','d',`M${f.x} ${f.y}L439 487L${n.x} ${n.y}`);set('pedal','d',`M${n.x-9} ${n.y+5}h32`);
const flutter=Math.sin(a*1.5)*7,flutter2=Math.sin(a*1.5-1)*5;set('scarfTail','d',`M468 237Q415 ${217+flutter} 379 ${229+flutter2}L350 ${217+flutter}L360 ${243+flutter}Q412 ${250+flutter2} 474 252Z`);
// The wing tip compensates for body bounce to stay on the handlebar.
set('wing','d',`M363 272Q395 250 429 278Q464 312 511 302Q552 ${293-bob} 597 ${291-bob}Q613 ${290-bob} 620 ${299-bob}Q624 ${306-bob} 611 ${308-bob}Q546 324 496 332Q439 344 392 316Q373 304 363 272Z`);
const blink=(time%5.7)>5.48;set('eye','opacity',blink?0:1);set('blink','opacity',blink?1:0);
tr('road',`translate(${-((time*115)%1000)} 0)`);tr('scenery',`translate(${-((time*42)%1000)} 0)`);tr('ripples',`translate(${-((time*12)%220)} 0)`);tr('clouds',`translate(${-((time*7)%1000)} 0)`);tr('shadow',`translate(0 0) scale(1 1)`);set('shadow','rx',260+Math.sin(a*2)*3);set('wind1','opacity',.4+.2*Math.sin(a));set('wind2','opacity',.4-.2*Math.sin(a));}
function ui(){$('play').textContent=playing?'暂停':'播放';$('play').setAttribute('aria-label',playing?'暂停动画':'播放动画')}
$('play').onclick=()=>{playing=!playing;ui()};$('speed').oninput=e=>{speed=+e.target.value;$('rate').value=speed.toFixed(1)+'×'};$('restart').onclick=()=>{t=0;render(t)};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();playing=!playing;ui()}});
document.addEventListener('visibilitychange',()=>last=null);
window.__seek=s=>{t=s;render(t)};window.__ready=true;render(0);ui();
function frame(now){if(last!==null&&playing&&!document.hidden){t+=Math.min((now-last)/1000,.05)*speed;if(window.__recording)t=Math.min(t,12);render(t)}last=now;requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
